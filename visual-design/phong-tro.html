<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phòng trọ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600&display=swap">
<style>
/* Same design system as tang-intern.html: tokens, HUD cards, chips, sheet, modal. Only the room and the transition are new. */
:root{
  --ground:#f9f0e1; --ink:#2a2230; --paper:#fffdf8; --muted:#7a6f74; --accent:#e8505b; --lock:#b9b0a6; --yellow:#f7d046;
  --xp:#3c83ec; --pin:#44ba6a; --ut:#e3b23c; --qh:#f45561;
  --up:#dff3e4; --down:#fde2e3; --rule:#eadfcd;
  --font-display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --font-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
.hud{position:fixed;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
.hud.tl{top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));flex-direction:column}
.hud.tr{top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.where{padding:8px 12px;display:grid;gap:2px}
.where b{font-family:var(--font-display);font-weight:800;font-size:20px;line-height:1.1}
.where span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.where .goal{font-size:12px;font-weight:600;color:var(--accent);max-width:250px;line-height:1.35}
.where .kpi{font-size:12px;color:var(--ink);max-width:250px;line-height:1.35} /* weekly KPI (same as tầng Intern) */
.where .kpi.done{color:var(--pin);font-weight:600}
.seg{display:flex;padding:3px;gap:3px}
.seg button{font:600 13px var(--font-body);border:0;background:transparent;color:var(--ink);padding:0 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible,.btn:focus-visible,.chip:focus-visible,.choice:focus-visible,.tool:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tool{font:600 13px var(--font-body);padding:0 12px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center}
.hud.tr > *{height:40px;box-sizing:border-box}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);background:var(--paper);border:1px solid var(--lock);border-radius:999px;padding:6px 14px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;z-index:4}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(76px + env(safe-area-inset-top,0px));font:600 13px var(--font-body);background:var(--accent);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 14px;z-index:6;white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
#tags{position:fixed;inset:0;pointer-events:none;z-index:3}
.chip{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;font:600 12px var(--font-body);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:3px 10px;white-space:nowrap;cursor:pointer;opacity:.85;transition:transform .15s,opacity .15s}
.chip::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:inherit;border:inherit;border-top:0;border-left:0;transform:translateX(-50%) rotate(45deg)}
.chip .bubble{width:46px;height:44px;display:block}
.chip.near{opacity:1;background:var(--accent);color:#fff;border-color:var(--ink);transform:translate(-50%,-112%) scale(1.08)}
.chip kbd{font:inherit;opacity:.85;margin-left:4px}
.chip.quest{background:transparent;border:0;padding:0;opacity:1;transform:translate(-22%,-94%);transform-origin:22% 94%;animation:quest-bob 1.1s ease-in-out infinite}
.chip.quest::after{display:none}
.chip.quest.near{background:transparent;animation:none;transform:translate(-22%,-94%) scale(1.12)}
@keyframes quest-bob{0%,100%{transform:translate(-22%,-94%)}50%{transform:translate(-22%,-114%)}}
.chip.task{opacity:1;border-color:var(--accent);color:var(--accent)}
.chip.task.near{color:#fff}
.sheet{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(460px,calc(100% - 32px));padding:16px 18px 14px;z-index:6;display:grid;gap:8px;box-sizing:border-box}
.sheet .eyebrow,.modal .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.sheet p,.modal p{margin:0;font-size:15px;line-height:1.5}
.sheet .row{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.sheet h2,.modal h2{margin:0;font:800 24px/1.1 var(--font-display);text-wrap:balance}
.btn{font:600 14px var(--font-body);background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:8px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.stats{padding:8px 12px;display:grid;grid-template-columns:auto 92px 30px;gap:5px 8px;align-items:center;font-size:12px}
.stats .bar{height:8px;border-radius:99px;background:var(--rule);border:1.5px solid var(--ink);overflow:hidden;position:relative}
.stats .bar i{display:block;height:100%;background:var(--c)}
.stats .bar s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.stats .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.stats .warn{color:var(--accent);animation:flash 1s steps(2) infinite}
@keyframes flash{50%{opacity:.35}}
.choices{display:grid;gap:8px;margin-top:6px}
.choice{text-align:left;font:500 14px/1.4 var(--font-body);background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.choice:hover{background:#fff4d6}
.choice b{color:var(--accent);margin-right:6px}
.choice small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.quote{color:var(--muted);font-size:13px}
.comment{font-style:italic}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.delta{font:600 12px var(--font-body);border-radius:999px;padding:2px 8px;border:1.5px solid var(--ink);background:var(--up)}
.delta.down{background:var(--down)}
.note{font-size:13px;color:var(--muted);margin-top:6px}
.modal-wrap{position:fixed;inset:0;background:rgba(42,34,48,.35);display:grid;place-items:center;z-index:12;padding:16px}
.modal-wrap.docked{background:none;place-items:end center;pointer-events:none;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}.modal-wrap.docked .modal{pointer-events:auto}
.modal{width:min(440px,100%);padding:18px;display:grid;gap:10px;max-height:calc(100vh - 32px);overflow:auto;box-sizing:border-box}
.modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;flex-wrap:wrap}
/* scene change: one full-screen card that fades in, swaps the scene, fades out */
.fade{position:fixed;inset:0;z-index:10;background:var(--ink);color:var(--paper);display:grid;place-items:center;align-content:center;gap:6px;text-align:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .5s ease}
.fade.on{opacity:1;pointer-events:auto}
.fade small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow);font-weight:600}
.fade b{font:800 40px/1.05 var(--font-display)}
.fade span{font-size:15px;opacity:.8;max-width:360px}
@media (prefers-reduced-motion:reduce){.chip{transition:none}.chip.quest,.stats .warn{animation:none}.fade{transition:none}}
@media (max-width:640px){.hud.tl{top:calc(62px + env(safe-area-inset-top,0px))}}
/* HUD layout: day card + stats stacked top-left, buttons top-right, Tan làm bottom-right; the hint, sheet and toast keep clear of all of them */
.hint{max-width:calc(100% - 300px)}
@media (max-width:760px){.hint{max-width:calc(100% - 32px);bottom:calc(64px + env(safe-area-inset-bottom,0px))}.sheet{bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
@media (max-width:900px){.toast{top:calc(272px + env(safe-area-inset-top,0px));white-space:normal;text-align:center;width:max-content;max-width:calc(100% - 32px);box-sizing:border-box}} /* toast drops below the day card + stats column */
</style>

<div id="stage"></div>
<div id="tags"></div>
<div class="hud tl">
  <div class="card where"><b id="room-name">Phòng trọ</b><span id="day-line"></span><span class="goal" id="goal"></span><span class="kpi" id="kpi-line" hidden></span></div>
  <div class="card stats" id="stats" aria-label="Chỉ số"></div>
</div>
<div class="hud tr">
  <button class="card tool" id="open-collection">Bộ sưu tập</button>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<div class="hint" id="hint">Chạm vào sàn để đi · WASD / phím mũi tên · E để tương tác</div>
<div class="card sheet" id="sheet" hidden role="dialog" aria-modal="false" aria-labelledby="sheet-title">
  <div class="eyebrow" id="sheet-eyebrow"></div>
  <h2 id="sheet-title"></h2>
  <div id="sheet-body"></div>
  <div class="row"><button class="btn" id="sheet-close">Đóng</button></div>
</div>
<div class="fade on" id="fade" aria-live="polite"><small id="fade-eyebrow"></small><b id="fade-title">Về phòng trọ</b><span id="fade-sub"></span></div>
<script>/* first frame: paint the scene-change card the previous page handed over, before the 3D world loads */try{const f=JSON.parse(sessionStorage.getItem('ssns-fade')),d=document.getElementById('fade');sessionStorage.removeItem('ssns-fade');if(f&&(d.classList.contains('on')||location.hash.includes('from=home'))){d.style.transition='none';d.classList.add('on');for(const k of['eyebrow','title','sub'])document.getElementById('fade-'+k).textContent=f[k]||''}}catch(e){}</script>
<div class="modal-wrap" id="modal-wrap" hidden><div class="card modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div></div>

{ const bad = [...G.validateRhythm(RHYTHM, CARD_DATA), ...Pl.validatePlacements(PLACEMENTS, 'home', Object.keys(SPOTS))]; if (bad.length) console.warn('nhip-choi.json / placements.json:', bad); }

/* ---------- Loop ---------- */
let followK = 0;
function resize(){
  const w = innerWidth, h = innerHeight, a = w/h; renderer.setSize(w, h, false);
  const f = a >= 1 ? Math.max(8.2 / a, 5.9) : 6.7 / a; followK = a >= 1 ? 0 : .45;
  const sh = f * (a >= 1 ? .2 : .14); // frustum raised = map drawn lower, clear of the two HUD panels top-left
  Object.assign(cam, {left:-f*a, right:f*a, top:f+sh, bottom:-f+sh}); cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
let doorArmed = false, nearId = null, t0 = performance.now(), lastRoom = null;
const v3 = new T.Vector3();
const place = (e, x, y, z) => { v3.set(x, y, z).project(cam);
  e.style.left = ((v3.x+1)/2*innerWidth) + 'px'; e.style.top = ((1-v3.y)/2*innerHeight) + 'px';
  return Math.abs(v3.x) <= 1 && v3.y <= .97 && v3.y >= -1; };
function tick(now){
  const dt = Math.min(.05, (now - t0)/1000); t0 = now; const speed = 3.4; let moving = false;
  const pos = player.g.position;
  let kx = 0, kz = 0;
  if (keys.has('w')||keys.has('arrowup')) { kx -= 1; kz -= 1; }
  if (keys.has('s')||keys.has('arrowdown')) { kx += 1; kz += 1; }
  if (keys.has('a')||keys.has('arrowleft')) { kx -= 1; kz += 1; }
  if (keys.has('d')||keys.has('arrowright')) { kx += 1; kz -= 1; }
  if (kx || kz) {
    const l = Math.hypot(kx, kz), dx = kx/l*speed*dt, dz = kz/l*speed*dt;
    if (free(pos.x + dx, pos.z)) pos.x += dx; if (free(pos.x, pos.z + dz)) pos.z += dz;
    player.g.rotation.y = Math.atan2(kx, kz); moving = true; closeSheet();
  } else if (player.path.length) {
    moving = stepChar(player, dt, speed);
    if (!player.path.length && pendingHot) { const id = pendingHot; pendingHot = null; openSheet(id); }
  }
  animateWalk(player, moving, dt);
  updateCat(dt); updateGuest(dt);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.hidden = true; }
  if (meBubble > 0) meBubbleEl.hidden = !place(meBubbleEl, pos.x, 2.25, pos.z); else meBubbleEl.hidden = true;
  updateSlots();
  const room = roomAt(pos.x, pos.z), rn = room && room.id !== 'home' ? 'Phòng trọ · ' + room.name : 'Phòng trọ';
  if (rn !== lastRoom) { lastRoom = rn; document.getElementById('room-name').textContent = rn; }
  if (camFocus) v3.copy(camFocus); else v3.set(CENTER.x + (pos.x - CENTER.x)*followK, 0, CENTER.z + (pos.z - CENTER.z)*followK);
  camTarget.lerp(v3, reduce ? 1 : Math.min(1, dt*3));
  cam.position.copy(camTarget).add(camOffset); cam.lookAt(camTarget);
  // nearest hotspot + chips: the night's goal lights up (laptop "!" or the bed), everything else shows only when close
  nearId = null; let best = 1.4;
  // the door's label waits until you have walked away from it once: you spawn right beside the door and it would cover the screen on arrival
  { const a = hotAt('door'), d = Math.hypot(a[0]-pos.x, a[1]-pos.z); if (d >= 1.4) doorArmed = true; }
  for (const id of Object.keys(HOT)) { if (id === 'door' && !doorArmed) continue; const a = hotAt(id), d = Math.hypot(a[0]-pos.x, a[1]-pos.z); if (d < best) { best = d; nearId = id; } }
  const msg = !!laptopCard(), hide = busy() || staging;
  for (const [id, e] of Object.entries(tagEls)) {
    const on = place(e, ...anchorOf(id)) && !hide; e.hidden = !on;
    const near = id === nearId, quest = id === 'laptop' && msg, task = id === 'bed' && !msg && !!S && !stagedTonight();
    const state = [near, quest, task].join('|');
    if (e.dataset.state !== state) { e.dataset.state = state; e.classList.toggle('near', near); e.classList.toggle('quest', quest); e.classList.toggle('task', task);
      e.innerHTML = (quest ? ICON.alert : HOT[id].act) + (near && !quest ? '<kbd> · E / chạm</kbd>' : ''); }
    if (!near && !quest && !task) e.hidden = true;
  }
  updateCoach();
  renderer.render(scene, cam);
  requestAnimationFrame(tick);
}
// Day-1 tutorial, last step: the first evening at home (mo-dau.json tutorial.steps.home); done for this browser once read
const coach = Op.makeCoach();
function updateCoach(){
  const h = OPENING.tutorial.steps.home, want = Op.tutorialOn(S) && S.part === 'evening' && !busy() && !staging && sheet.hidden && !laptopCard();
  if (!want) { if (coach.shown) coach.hide(); return; }
  coach.show({key:'home', who:h.who, text:G.fillName(h.line, S), buttons:[{label:OPENING.tutorial.ok, onClick:() => { Op.setGuide({done:true}); coach.hide(); }}]});
}
requestAnimationFrame(tick);
window.__ready = true;
</script>
