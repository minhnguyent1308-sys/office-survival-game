<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phòng trọ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600&display=swap">
<link rel="stylesheet" href="so.css">
<style>
/* Same design system as tang-intern.html: tokens, HUD cards, chips, sheet, modal. Only the room and the transition are new. */
:root{
  --ground:#f9f0e1; --ink:#2a2230; --paper:#fffdf8; --muted:#7a6f74; --accent:#e8505b; --lock:#b9b0a6; --yellow:#f7d046;
  --xp:#3c83ec; --pin:#44ba6a; --ut:#e3b23c; --qh:#f45561;
  --up:#dff3e4; --down:#fde2e3; --rule:#eadfcd;
  --font-display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --font-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
.hud{position:fixed;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
.hud.tl{top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));flex-direction:column}
.hud.tr{top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.where{padding:8px 12px;display:grid;gap:2px}
.where b{font-family:var(--font-display);font-weight:800;font-size:20px;line-height:1.1}
.where span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.where .goal{font-size:12px;font-weight:600;color:var(--accent);max-width:250px;line-height:1.35}
.where .kpi{font-size:12px;color:var(--ink);max-width:250px;line-height:1.35} /* weekly KPI (same as tầng Intern) */
.where .kpi.done{color:var(--pin);font-weight:600}
.where .event{font-size:12px;font-weight:600;color:var(--ink);max-width:250px;line-height:1.35} /* live event (same as tầng Intern) */
.seg{display:flex;padding:3px;gap:3px}
.seg button{font:600 13px var(--font-body);border:0;background:transparent;color:var(--ink);padding:0 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible,.btn:focus-visible,.chip:focus-visible,.choice:focus-visible,.tool:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tool{font:600 13px var(--font-body);padding:0 12px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center}
.hud.tr > *{height:40px;box-sizing:border-box}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);background:var(--paper);border:1px solid var(--lock);border-radius:999px;padding:6px 14px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;z-index:4}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(76px + env(safe-area-inset-top,0px));font:600 13px var(--font-body);background:var(--accent);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 14px;z-index:6;white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
#tags{position:fixed;inset:0;pointer-events:none;z-index:3}
.chip{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;font:600 12px var(--font-body);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:3px 10px;white-space:nowrap;cursor:pointer;opacity:.85;transition:transform .15s,opacity .15s}
.chip::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:inherit;border:inherit;border-top:0;border-left:0;transform:translateX(-50%) rotate(45deg)}
.chip .bubble{width:46px;height:44px;display:block}
.chip.near{opacity:1;background:var(--accent);color:#fff;border-color:var(--ink);transform:translate(-50%,-112%) scale(1.08)}
.chip kbd{font:inherit;opacity:.85;margin-left:4px}
.chip.quest{background:transparent;border:0;padding:0;opacity:1;transform:translate(-22%,-94%);transform-origin:22% 94%;animation:quest-bob 1.1s ease-in-out infinite}
.chip.quest::after{display:none}
.chip.quest.near{background:transparent;animation:none;transform:translate(-22%,-94%) scale(1.12)}
@keyframes quest-bob{0%,100%{transform:translate(-22%,-94%)}50%{transform:translate(-22%,-114%)}}
.chip.task{opacity:1;border-color:var(--accent);color:var(--accent)}
.chip.task.near{color:#fff}
.sheet{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(460px,calc(100% - 32px));padding:16px 18px 14px;z-index:6;display:grid;gap:8px;box-sizing:border-box}
.sheet .eyebrow,.modal .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.sheet p,.modal p{margin:0;font-size:15px;line-height:1.5}
.sheet .row{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.sheet h2,.modal h2{margin:0;font:800 24px/1.1 var(--font-display);text-wrap:balance}
.btn{font:600 14px var(--font-body);background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:8px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.stats{padding:8px 12px;display:grid;grid-template-columns:auto 92px 30px;gap:5px 8px;align-items:center;font-size:12px}
.stats .bar{height:8px;border-radius:99px;background:var(--rule);border:1.5px solid var(--ink);overflow:hidden;position:relative}
.stats .bar i{display:block;height:100%;background:var(--c)}
.stats .bar s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.stats .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.stats .warn{color:var(--accent);animation:flash 1s steps(2) infinite}
@keyframes flash{50%{opacity:.35}}
.choices{display:grid;gap:8px;margin-top:6px}
.choice{text-align:left;font:500 14px/1.4 var(--font-body);background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.choice:hover{background:#fff4d6}
.choice b{color:var(--accent);margin-right:6px}
.choice small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.quote{color:var(--muted);font-size:13px}
.comment{font-style:italic}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.delta{font:600 12px var(--font-body);border-radius:999px;padding:2px 8px;border:1.5px solid var(--ink);background:var(--up)}
.delta.down{background:var(--down)}
.note{font-size:13px;color:var(--muted);margin-top:6px}
.modal-wrap{position:fixed;inset:0;background:rgba(42,34,48,.35);display:grid;place-items:center;z-index:12;padding:16px}
.modal-wrap.docked{background:none;place-items:end center;pointer-events:none;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}.modal-wrap.docked .modal{pointer-events:auto}
.modal{width:min(440px,100%);padding:18px;display:grid;gap:10px;max-height:calc(100vh - 32px);overflow:auto;box-sizing:border-box}
.modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;flex-wrap:wrap}
/* scene change: one full-screen card that fades in, swaps the scene, fades out */
.fade{position:fixed;inset:0;z-index:10;background:var(--ink);color:var(--paper);display:grid;place-items:center;align-content:center;gap:6px;text-align:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .5s ease}
.fade.on{opacity:1;pointer-events:auto}
.fade small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow);font-weight:600}
.fade b{font:800 40px/1.05 var(--font-display)}
.fade span{font-size:15px;opacity:.8;max-width:360px}
/* wallet line + place bar (Lily 17/11); the Chợ Trọ catalog itself is drawn by so.css (shared with Bộ sưu tập). Approved in noi-that-xem-truoc.html */
.where .money{font-size:13px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.btn:disabled{background:var(--lock);cursor:default}
.place-bar .why{font-size:13px;color:var(--accent);font-weight:600;min-height:1.4em}
.place-bar .row{flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.chip{transition:none}.chip.quest,.stats .warn{animation:none}.fade{transition:none}}
@media (max-width:640px){.hud.tl{top:calc(62px + env(safe-area-inset-top,0px))}}
/* HUD layout: day card + stats stacked top-left, buttons top-right, Tan làm bottom-right; the hint, sheet and toast keep clear of all of them */
.hint{max-width:calc(100% - 300px)}
@media (max-width:760px){.hint{max-width:calc(100% - 32px);bottom:calc(64px + env(safe-area-inset-bottom,0px))}.sheet{bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
@media (max-width:900px){.toast{top:calc(272px + env(safe-area-inset-top,0px));white-space:normal;text-align:center;width:max-content;max-width:calc(100% - 32px);box-sizing:border-box}} /* toast drops below the day card + stats column */
</style>

<div id="stage"></div>
<div id="tags"></div>
<div class="hud tl">
  <div class="card where"><b id="room-name">Phòng trọ</b><span id="day-line"></span><span class="goal" id="goal"></span><span class="kpi" id="kpi-line" hidden></span><span class="event" id="event-line" hidden></span><span class="money" id="wallet-line" hidden></span></div>
  <div class="card stats" id="stats" aria-label="Chỉ số"></div>
</div>
<div class="hud tr">

  <!-- Bộ sưu tập shown again (Lily 17/11) -->
  <button class="card tool" id="open-collection">Bộ sưu tập</button>
</div>
<div class="toast" id="toast" hidden role="status"></div>

  <div class="eyebrow" id="sheet-eyebrow"></div>

</div>

  <div class="eyebrow">Sắp xếp phòng</div>
  <h2 id="place-title"></h2>

  <div class="why" id="place-why" aria-live="polite"></div>
  <div class="row" id="place-row"></div>
</div>
<div class="cat-wrap" id="catalog" hidden>
  <div class="book" role="dialog" aria-modal="true" aria-labelledby="cat-title">
    <nav class="tabs" role="tablist" aria-label="Sổ đồ">
      <button class="tab" role="tab" data-tab="shop">Chợ Trọ</button>
      <button class="tab" role="tab" data-tab="box">Thùng đồ</button>
    </nav>
    <div class="page card">
      <button class="x" id="cat-close" aria-label="Đóng">×</button>
      <header><h2 id="cat-title"></h2><p id="cat-tagline"></p></header>
      <div class="shop-bar"><label class="search"><input id="cat-search" type="search" placeholder="Tìm món đồ…" aria-label="Tìm món đồ"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg></label><span class="wallet" id="cat-wallet"></span></div>
      <div class="cats" id="cat-cats" role="group" aria-label="Nhóm đồ"></div>
      <div class="grid" id="cat-grid"></div>
      <div class="detail" id="cat-detail"></div>
    </div>
  </div>
</div>
<div class="fade on" id="fade" aria-live="polite"><small id="fade-eyebrow"></small><b id="fade-title">Về phòng trọ</b><span id="fade-sub"></span></div>
<script>/* first frame: paint the scene-change card the previous page handed over, before the 3D world loads */try{const f=JSON.parse(sessionStorage.getItem('ssns-fade')),d=document.getElementById('fade');sessionStorage.removeItem('ssns-fade');if(f&&(d.classList.contains('on')||location.hash.includes('from=home'))){d.style.transition='none';d.classList.add('on');for(const k of['eyebrow','title','sub'])document.getElementById('fade-'+k).textContent=f[k]||''}}catch(e){}</script>
<div class="cat-wrap" id="collection" hidden></div>
<div class="modal-wrap" id="modal-wrap" hidden><div class="card modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div></div>

await Promise.race([document.fonts?.load('800 60px "Baloo 2"').catch(()=>{}), new Promise(r => setTimeout(r, 1500))]);

const stage = document.getElementById('stage');
const renderer = new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.outputColorSpace = T.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const camOffset = new T.Vector3(20, 19, 20);
const CENTER = new T.Vector3(WX/2, 0, D/2 - .1);
const camTarget = CENTER.clone();

// evening: same bright look, a touch warmer; lamps come with the furniture (nightstand, floor lamp)
const hemi = new T.HemisphereLight('#fff8ef', '#c9b89b', 1.5); scene.add(hemi);
const sun = new T.DirectionalLight('#ffe9cf', 1.9);
sun.position.set(W/2 + 6, 14, D/2 - 4); sun.target.position.set(W/2, 0, D/2); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -0.0006;
Object.assign(sun.shadow.camera, {left:-9, right:9, top:9, bottom:-9, near:1, far:50}); scene.add(sun);

const {mat, box, textTex, faceMats, sign, plant, makeChar, blockers, hotMeshes} = Wd.makeKit(scene);
const cyl = (x, y, z, rt, rb, h, c, seg=18) => { const m = new T.Mesh(new T.CylinderGeometry(rt, rb, h, seg), mat(c)); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m; };

/* ---------- Floor: wooden planks, small tiles in the bathroom ---------- */
{

  for (let i=0;i<W*K;i++) for (let j=0;j<D*K;j++){

}

box(-.25, -.25, 0, .25, D + .25, 3, P.wallL, {round:0, block:true});

box(0, 0, 0, W, .04, .14, P.woodDark, {round:0, cast:false});

halfWall(2.45, 0, 2.55, 1.4); halfWall(0, 2.45, 2.55, 2.55);

const nightTex = (() => { const c = document.createElement('canvas'); c.width = 320; c.height = 220; const x = c.getContext('2d');

  x.fillStyle = P.night; x.beginPath(); x.arc(262, 47, 22, 0, Math.PI*2); x.fill();

  x.fillStyle = '#4c5a9c'; x.fillRect(20, 120, 110, 100); x.fillRect(150, 90, 90, 130);                       // office tower across the street, still lit
  x.fillStyle = P.yellow; for (let i=0;i<4;i++) for (let j=0;j<4;j++) if ((i*7 + j*3) % 5) x.fillRect(32 + i*24, 132 + j*22, 12, 10);

box(2.95, -.02, 1.2, 1.7, .06, 1.15, P.trim, {round:0, cast:false});
box(3.02, .0, 1.27, 1.56, .05, 1.01, P.night, {round:0, cast:false, faces:faceMats(P.night, 4, new T.MeshBasicMaterial({map:nightTex}))});
box(3.77, .02, 1.27, .06, .05, 1.01, P.trim, {round:0, cast:false});              // window bar
box(2.95, .02, 1.12, 1.7, .22, .06, P.trim, {round:0});                         // sill
// The laptop (Lily 17/11): on the floor, with a folded blanket to sit on, until the desk is bought; then on the desk (slot ban_hoc in noi-that.json)
const screenMat = mat(P.screen, {emissive:P.screen, emissiveIntensity:.15});
const LAP_FLOOR = new T.Group(), LAP_DESK = new T.Group(); scene.add(LAP_FLOOR, LAP_DESK);
const inGroup = (grp, m) => { scene.remove(m); grp.add(m); return m; };

// where tonight's guest sits: at the low table if you bought one (Lily 17/11), otherwise on the floor; you stand across from them (me)
let guest = null, GS = null;
function guestSpots(){
  const t = furnAt('ban_tra');
  if (t) { const cz = (t.rect.z0 + t.rect.z1)/2, seat = [t.rect.x1 + .7, cz];
    if (free(...seat)) return {seat, stand:[seat[0], cz - .95], me:[t.rect.x0 - .45, cz], lap:[t.rect.x1 - .6, cz - .25, .32]}; }
  return {seat:[5.75, 3.7], stand:[5.75, 2.75], me:[4.5, 3.7], lap:[5.0, 3.45, 0]};
}
function spawnGuest(npc, {seated = false} = {}){
  const c = makeChar(Wd.NPC_LOOKS[npc]); c.g.traverse(m => { if (m.isMesh) { m.userData.hot = 'guest'; hotMeshes.push(m); } });
  HOT.guest.title = G.NPC_NAME[npc]; HOT.guest.lines = GUEST_LINES[npc]; HOT.guest.tag = G.NPC_NAME[npc];
  GS = guestSpots(); box(GS.seat[0] - .25, GS.seat[1] - .35, 0, .6, .7, .1, P.red, {round:.05, cast:false});   // a floor cushion for them
  guest = {c, npc, seated:false, done:null, wait: reduce ? 0 : 1.7};   // starts walking in once the scene card has faded
  if (seated) return sitGuest();
  c.g.position.set(DOOR_IN[0], 0, DOOR_IN[1]); walkPlan(c, GS.seat[0], GS.seat[1]);
  return new Promise(r => guest.done = r);
}
function sitGuest(){
  const c = guest.c; c.path = []; c.g.position.set(GS.seat[0], .18 - c.hip, GS.seat[1]); c.g.rotation.y = -Math.PI/2;   // facing the table
  c.parts.legL.rotation.x = c.parts.legR.rotation.x = -Math.PI/2; c.parts.armL.rotation.x = c.parts.armR.rotation.x = -.9; // cross-legged, hands on the keyboard
  const [lx, lz, ly] = GS.lap;
  box(lx, lz, ly, .45, .5, .03, P.metal, {round:.01});                                                // guest's laptop: base + screen facing them
  box(lx - .03, lz, ly + .03, .04, .5, .32, P.metalDark, {round:.01, faces:faceMats(P.metalDark, 0, mat(P.screen, {emissive:P.screen, emissiveIntensity:.6}))});
  extraBlockers.push({x0:GS.seat[0] - .45, z0:GS.seat[1] - .4, x1:GS.seat[0] + .4, z1:GS.seat[1] + .4}); rebuildBlockers();
  guest.seated = true; catVisit();
  guest.done?.(); guest.done = null;
}
function catVisit(){ const s = catState; catWake(); cat.path = []; if (walkPlan(cat, GS.seat[0] - .15, GS.seat[1] + .9)) { s.phase = 'walk'; s.timer = 20; } }
function updateGuest(dt){
  if (!guest || guest.seated) return;
  if (guest.wait > 0) { guest.wait -= dt; return; }
  const moving = stepChar(guest.c, dt, 2.6); animateWalk(guest.c, moving, dt);
  if (!moving) sitGuest();
}
function updateCat(dt){
  const s = catState; let moving = false;
  if (pendingHot === 'cat' || (!sheet.hidden && talkId === 'cat')) {                     // you came over: it waits and looks at you
    const p = player.g.position, q = cat.g.position; cat.g.rotation.y = Math.atan2(p.x - q.x, p.z - q.z); cat.path = [];
  } else if (s.phase === 'walk') { moving = stepChar(cat, dt, 1.3); if (!moving) { const n = napSpot(); s.phase = Math.hypot(cat.g.position.x - n.walk[0], cat.g.position.z - n.walk[1]) < .3 ? 'nap' : 'idle'; if (s.phase === 'nap') catRest(n); s.timer = s.phase === 'nap' ? rand(8, 14) : rand(2, 5); } }
  else { s.timer -= dt; if (s.timer <= 0) {
    catWake(); const plant = furnAt('cay_lon');
    let tx, tz; if (Math.random() < .25) [tx, tz] = napSpot().walk;
    else if (plant && Math.random() < .2) { const [x, z] = centerOf(plant.rect); [tx, tz] = [x - .45, z - .45]; }   // hides behind the big plant
    else { for (let k=0;k<20;k++) { tx = rand(.6, WX-.6); tz = rand(.6, D-.6); if (free(tx, tz) && roomAt(tx, tz).id !== 'wc') break; } }
    if (walkPlan(cat, tx, tz)) s.phase = 'walk'; else s.timer = 1; } }
  cat.phase = moving ? cat.phase + dt*14 : 0;
  const sw = reduce ? 0 : Math.sin(cat.phase) * .5;
  cat.legs.forEach((l, i) => l.rotation.x = (i === 0 || i === 3 ? sw : -sw));
  const napping = s.phase === 'nap' && !moving;
  cat.g.position.y = napping ? (cat.onBed ? .48 : .01) : 0; // curled up on top of the cushion cat.legs.forEach(l => l.visible = !napping);
  cat.tail.rotation.y = reduce ? 0 : Math.sin(performance.now()/400) * (napping ? .15 : .5);
}

let pendingHot = null; const keys = new Set();
const ray = new T.Raycaster(), ndc = new T.Vector2(), floorPlane = new T.Plane(new T.Vector3(0,1,0), 0);
function walkTo(x, z, hot=null){ if (busy()) return; if (walkPlan(player, x, z)) { pendingHot = hot; closeSheet();

renderer.domElement.addEventListener('pointerdown', e => {
  const r = renderer.domElement.getBoundingClientRect();

  ray.setFromCamera(ndc, cam);
  if (placing || arranging) return placePointer(e, true);
  const hit = ray.intersectObjects(hotMeshes, false).find(h => shown(h.object));
  if (hit) { goHot(hit.object.userData.hot); return; }
  const p = new T.Vector3(); if (ray.ray.intersectPlane(floorPlane, p)) walkTo(p.x, p.z);
});
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button, input')) return;
  const k = e.key.toLowerCase();
  if (k === 'escape' && !catalogEl.hidden) return closeCatalog();
  if (placing || arranging) return placeKey(e, k);
  if (busy()) return;
  if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) { keys.add(k); player.path = []; pendingHot = null; e.preventDefault(); }
  if (k === 'e' || k === 'enter') { if (nearId) openSheet(nearId); }

});

const shown = o => { for (; o; o = o.parent) if (!o.visible) return false; return true; };   // hidden laptop / furniture can't be clicked

/* ---------- Placing, moving and storing furniture: a ghost on a 0.25 grid, Xoay / Đặt / Hủy (Lily 17/11) ---------- */

function spotProblem(item, rect, skip){
  if (item.wall) return wallProblem(item, rect, skip);
  if (rect.x0 < 0 || rect.z0 < 0 || rect.x1 > W || rect.z1 > D) return 'Ra ngoài phòng mất rồi';
  if (NO_FURN.some(r => overlap(r, rect))) return 'Chỗ này phải để trống (lối đi, nhà vệ sinh)';
  if (BASE_BLOCKERS.some(b => overlap(b, rect))) return 'Vướng đồ của chủ trọ';
  if (item.flat) return null;
  if (furn.some(f => f.index !== skip && !f.item.flat && !f.item.wall && overlap(f.rect, rect))) return 'Vướng món khác';
  const desk = G.itemById(DESK), slot = G.homeRoom(S).slots[desk.slot];
  if (item.id !== DESK && !G.isPlaced(S, DESK) && (overlap(LAPTOP_FLOOR_RECT, rect) || overlap(rectOf(desk, slot.x, slot.z, slot.rot || 0), rect))) return 'Chỗ này để dành cho bàn học';
  if (item.id !== DESK && G.isPlaced(S, DESK) && furnAt(DESK) && overlap(furnAt(DESK).rect, rect) && skip !== furnAt(DESK).index) return 'Vướng món khác';
  const p = player.g.position; if (overlap(rect, {x0:p.x - .2, z0:p.z - .2, x1:p.x + .2, z1:p.z + .2})) return 'Bạn đang đứng ở đó';
  return null;
}
// the free spot nearest to you, for a fresh item (and for leftovers bought without a box)
function freeSpot(item, rot, near = [player.g.position.x, player.g.position.z]){
  let best = null, bd = Infinity;
  for (const ro of item.wall ? [0, 1] : [rot])   // a wall item: the nearest free spot on either wall
    for (let x = 0; x <= W; x += SNAP) for (let z = 0; z <= D; z += SNAP) {
      const r = rectOf(item, x, z, ro); if (spotProblem(item, r, -1)) continue;
      const [cx, cz] = centerOf(r), d = Math.hypot(cx - near[0], cz - near[1]); if (d < bd) { bd = d; best = item.wall ? {x, z, rot:ro} : {x, z}; }
    }

}
// bought without a box but never placed (the page closed mid-way): put them down by themselves
function placeLeftovers(){
  if (G.hasBox(S)) { for (const u of G.unplaced(S)) if (u.item.id === G.furnitureData().box) placeAuto(u.item); return; }
  for (const u of G.unplaced(S)) for (let i = 0; i < u.n; i++) placeAuto(u.item);

function placeAuto(item){ furn = G.placedHere(S).map((p, index) => ({index, item:G.itemById(p.id), rect:rectOf(G.itemById(p.id), p.x, p.z, p.rot)}));
  const at = item.slot ? {x:0, z:0} : freeSpot(item, 0, [W/2, D/2]) || {x:3, z:4}; G.putItem(S, item.id, at.x, at.z, at.rot || 0); save(); }
function startPlace(item, {index = null, must = false} = {}){

  if (index == null && item.slot) {                                       // the desk: straight into its slot
    G.putItem(S, item.id, 0, 0, 0); drawFurniture(); afterChange();
    toast(item.id === DESK ? `${item.name} đã vào chỗ dưới cửa sổ. Laptop lên bàn rồi.` : `${item.name} đã vào chỗ.`); return renderPlace();
  }
  const p = index != null ? G.placedHere(S)[index] : null;
  placing = {item, index, must, rot:p?.rot ?? 0, x:p?.x ?? 0, z:p?.z ?? 0, fixed:!!item.slot};
  if (!p) Object.assign(placing, freeSpot(item, 0) || {x:snap(player.g.position.x), z:snap(player.g.position.z + .5)});

}
function buildGhost(){
  dropGhost(); if (placing.fixed) return;
  const {g} = NTm.placeItem(scene, mat, placing.item, placing);
  g.traverse(m => { if (!m.isMesh) return; m.castShadow = false; const fade = x => { x = x.clone(); x.transparent = true; x.opacity = .75; return x; };
    m.material = Array.isArray(m.material) ? m.material.map(fade) : fade(m.material); });

  plate.rotation.x = -Math.PI/2; scene.add(plate);

}
function dropGhost(){ if (ghost) { scene.remove(ghost.g, ghost.plate); ghost = null; } }
function moveGhost(x, z){
  const it = placing.item, r0 = rectOf(it, 0, 0, placing.rot), w = r0.x1, d = r0.z1;
  x = Math.max(0, Math.min(W - w, snap(x))); z = Math.max(0, Math.min(D - d, snap(z)));

function renderPlace(){

  } else if (arranging) {
    $('place-title').textContent = 'Sắp xếp phòng';
    $('place-text').textContent = G.hasBox(S) ? 'Chạm vào một món để dời chỗ hoặc cất vào thùng.' : 'Chạm vào một món để dời chỗ. Có thùng đồ thì cất được.';

}
document.getElementById('arrange').onclick = () => { if (busy() || staging || placing) return; closeSheet(); arranging = true; renderPlace(); };
function placePointer(e, down){
  if (!placing) {                                                          // arranging: pick the item you tapped
    if (!down) return;
    const hit = ray.intersectObjects(FURN.children, true).find(h => shown(h.object)); if (!hit) return;
    let o = hit.object; while (o && o.userData.idx == null) o = o.parent;
    if (o) startPlace(furn.find(f => f.index === o.userData.idx).item, {index:o.userData.idx});
    return;
  }
  if (placing.fixed) return;

  ndc.set(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1); ray.setFromCamera(ndc, cam);
  const p = new T.Vector3(); if (!ray.ray.intersectPlane(floorPlane, p)) return;
  if (placing.item.wall) { const ro = p.x < p.z ? 1 : 0; if (ro !== placing.rot) { placing.rot = ro; buildGhost(); } }   // the nearer wall: left or back
  const r0 = rectOf(placing.item, 0, 0, placing.rot), before = [placing.x, placing.z];
  moveGhost(p.x - r0.x1/2, p.z - r0.z1/2);

  if (down && (e.pointerType === 'mouse' || (before[0] === placing.x && before[1] === placing.z))) confirmPlace();
}
function placeKey(e, k){

  const step = {arrowleft:[-SNAP, 0], arrowright:[SNAP, 0], arrowup:[0, -SNAP], arrowdown:[0, SNAP], a:[-SNAP, 0], d:[SNAP, 0], w:[0, -SNAP], s:[0, SNAP]}[k];

}

/* ---------- Staged night events (cards.json when "night" + stage, Lily 15/11): "!" over you, a scene change to the spot, then the story ---------- */
// Named spots in the room (stage.spot): where you stand, where the people in stage.people stand (in order), where the cat goes
const SPOTS = {
  door:    {name:'Cửa phòng',   player:{x:5.6, z:2.05, rot:Math.PI}, people:[{x:5.6, z:1.0, rot:0}]},
  bed:     {name:'Bên giường',  player:{x:2.75, z:3.9, rot:-Math.PI/2}},
  balcony: {name:'Ban công',    player:{x:9.45, z:5.5, rot:Math.atan2(.85, -1.1)}, people:[{x:10.3, z:4.4, rot:Math.atan2(-.85, 1.1)}]},   // side by side across the screen, not one behind the other
  kitchen: {name:'Góc bếp',     player:{x:7.2, z:1.55, rot:Math.PI}, cat:[7.95, 1.5]},
  laptop:  {name:'Laptop', anchor:ANCHOR.laptop},     // partner slot only (placements.json)
};
const stagedTonight = () => { if (S?.part !== 'evening') return null; const c = G.tonightsCard(S, CARDS); return c && G.isStaged(c) ? c : null; };
const meBubbleEl = document.createElement('button'); meBubbleEl.className = 'chip quest'; meBubbleEl.innerHTML = ICON.alert; meBubbleEl.hidden = true; meBubbleEl.tabIndex = -1; meBubbleEl.setAttribute('aria-hidden', 'true');
tagsEl.appendChild(meBubbleEl);
let meBubble = 0, staging = false;
async function runStage(c){
  const st = c.stage, sp = SPOTS[st.spot]; if (!sp || staging) return;
  staging = true; fading = true; keys.clear(); player.path = []; pendingHot = null; closeSheet();
  meBubble = 99; await wait(1300); meBubble = 0;                                   // 1. "!" over your head
  const extras = [], dark = st.mood === 'dark';
  await sceneChange({eyebrow:`${G.weekdayName(S.day)} · ${st.time}`, title:c.title, sub:sp.name}, () => {   // 2. scene change, 3. everyone in place
    const p = sp.player; player.g.position.set(p.x, 0, p.z); player.g.rotation.y = p.rot;
    (st.people || []).forEach((id, i) => { const q = sp.people?.[Math.min(i, sp.people.length - 1)]; if (!q) return;
      const ch = makeChar(Wd.NPC_LOOKS[id] || {}); ch.g.position.set(q.x, 0, q.z); ch.g.rotation.y = q.rot; extras.push(ch); });
    if (sp.cat) { cat.path = []; cat.onBed = false; cat.g.position.set(sp.cat[0], 0, sp.cat[1]); cat.g.rotation.y = Math.atan2(p.x - sp.cat[0], p.z - sp.cat[1]); catState.phase = 'idle'; catState.timer = 30; }
    if (dark) { hemi.intensity = .3; sun.intensity = .2; }
    stageTime = st.time; renderHUD();
    const all = [p, ...extras.map(ch => ({x:ch.g.position.x, z:ch.g.position.z}))];
    camFocus = new T.Vector3(all.reduce((a, q) => a + q.x, 0) / all.length + .9, 0, all.reduce((a, q) => a + q.z, 0) / all.length + .9);   // +x+z = lower on screen, so the spot sits above the docked story
    cam.zoom = 1.45; cam.updateProjectionMatrix();
  });
  await wait(600);
  const eyebrow = `${G.dayName(S)} · ${st.time} · ${sp.name}`;                      // 4. the story
  modal({eyebrow, title:c.title, docked:true, nodes:[c.intro, choiceList(c, i => {
    const res = G.chooseOption(S, c, i); afterChange(); lightsFor();
    modal({eyebrow, title:c.title, docked:true, nodes:resultNodes(res), actions:[{label:st.button || 'Tiếp tục', onClick:() => {
      closeModal(); staging = false;
      for (const ch of extras) ch.g.removeFromParent();                            // guests leave, lights back on
      if (dark) { hemi.intensity = 1.5; sun.intensity = 1.9; }
      stageTime = null; camFocus = null; cam.zoom = 1; cam.updateProjectionMatrix();
      renderHUD();
    }}]});
  })]});
}
// what tonight holds once you are in: a staged event starts by itself, a message lights the laptop
const nightStart = () => { const c = stagedTonight(); if (c) setTimeout(() => runStage(c), reduce ? 200 : 700); else laptopToast(); };
const updateSlots = Pl.mountSlots({map:'home', anchorOf:id => SPOTS[id]?.anchor, layer:tagsEl, save, project:(e, [x, y, z]) => place(e, x, y, z)});
{ const bad = [...G.validateRhythm(RHYTHM, CARD_DATA), ...Pl.validatePlacements(PLACEMENTS, 'home', Object.keys(SPOTS))]; if (bad.length) console.warn('nhip-choi.json / placements.json:', bad); }

/* ---------- Arrival: the scene-change card from the office fades out on the room ---------- */
wearLook(G.lookOf(S));
G.ensureHome(S); if (G.completeStyles(S)) save(); placeLeftovers(); drawFurniture();   // a save that already owned a whole style gets its badge
{ const n = napSpot(); if (n.bed) catRest(n); else cat.g.position.set(n.walk[0], 0, n.walk[1]); }
if (S.part === 'evening') {
  Wd.paintFade(Wd.homeCard(G.weekdayName(S.day), S.day));
  arriveHome(); G.drawNight(S, CARDS);
} else { Wd.paintFade({eyebrow:'Cuối tuần', title:'Ở nhà'}); player.g.position.set(2.6, 0, 3.8); }
{ const n = S.part === 'evening' && S.today.nightDone && G.cardById(CARDS, S.today.nightCardId); if (n && G.isVisit(n)) { spawnGuest(n.npc, {seated:true}); player.path = []; player.g.position.set(GS.me[0], 0, GS.me[1]); player.g.rotation.y = Math.PI/2; } }
afterChange(); lightsFor();
if (location.hash) history.replaceState(null, '', location.pathname + location.search); // the run lives in storage now
fading = true;
setTimeout(async () => { fadeEl.classList.remove('on'); await wait(500); fading = false; nightStart(); }, reduce ? 200 : 900);

/* ---------- Loop ---------- */
let followK = 0;
function resize(){
  const w = innerWidth, h = innerHeight, a = w/h; renderer.setSize(w, h, false);
  const f = a >= 1 ? Math.max(8.2 / a, 5.9) : 6.7 / a; followK = a >= 1 ? 0 : .45;
  const sh = f * (a >= 1 ? .2 : .14); // frustum raised = map drawn lower, clear of the two HUD panels top-left
  Object.assign(cam, {left:-f*a, right:f*a, top:f+sh, bottom:-f+sh}); cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
let doorArmed = false, nearId = null, t0 = performance.now(), lastRoom = null;
const v3 = new T.Vector3();
const place = (e, x, y, z) => { v3.set(x, y, z).project(cam);
  e.style.left = ((v3.x+1)/2*innerWidth) + 'px'; e.style.top = ((1-v3.y)/2*innerHeight) + 'px';
  return Math.abs(v3.x) <= 1 && v3.y <= .97 && v3.y >= -1; };
function tick(now){
  const dt = Math.min(.05, (now - t0)/1000); t0 = now; const speed = 3.4; let moving = false;
  const pos = player.g.position;
  let kx = 0, kz = 0;
  if (keys.has('w')||keys.has('arrowup')) { kx -= 1; kz -= 1; }
  if (keys.has('s')||keys.has('arrowdown')) { kx += 1; kz += 1; }
  if (keys.has('a')||keys.has('arrowleft')) { kx -= 1; kz += 1; }
  if (keys.has('d')||keys.has('arrowright')) { kx += 1; kz -= 1; }
  if (kx || kz) {
    const l = Math.hypot(kx, kz), dx = kx/l*speed*dt, dz = kz/l*speed*dt;
    if (free(pos.x + dx, pos.z)) pos.x += dx; if (free(pos.x, pos.z + dz)) pos.z += dz;
    player.g.rotation.y = Math.atan2(kx, kz); moving = true; closeSheet();
  } else if (player.path.length) {
    moving = stepChar(player, dt, speed);
    if (!player.path.length && pendingHot) { const id = pendingHot; pendingHot = null; openSheet(id); }
  }
  animateWalk(player, moving, dt);
  updateCat(dt); updateGuest(dt);
  for (const f of furn) if (f.twinkle) f.twinkle.emissiveIntensity = reduce ? 1.2 : 1 + .6*Math.sin(now/260 + f.index);   // fairy lights
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.hidden = true; }
  if (meBubble > 0) meBubbleEl.hidden = !place(meBubbleEl, pos.x, Wd.TAG_Y, pos.z); else meBubbleEl.hidden = true;
  updateSlots();
  const room = roomAt(pos.x, pos.z), rn = room && room.id !== 'home' ? 'Phòng trọ · ' + room.name : 'Phòng trọ';
  if (rn !== lastRoom) { lastRoom = rn; document.getElementById('room-name').textContent = rn; }
  if (camFocus) v3.copy(camFocus); else v3.set(CENTER.x + (pos.x - CENTER.x)*followK, 0, CENTER.z + (pos.z - CENTER.z)*followK);
  camTarget.lerp(v3, reduce ? 1 : Math.min(1, dt*3));
  cam.position.copy(camTarget).add(camOffset); cam.lookAt(camTarget);
  // nearest hotspot + chips: the night's goal lights up (laptop "!" or the bed), everything else shows only when close
  nearId = null; let best = 1.4;
  // the door's label waits until you have walked away from it once: you spawn right beside the door and it would cover the screen on arrival
  { const a = hotAt('door'), d = Math.hypot(a[0]-pos.x, a[1]-pos.z); if (d >= 1.4) doorArmed = true; }
  for (const id of Object.keys(HOT)) { if (id === 'door' && !doorArmed) continue; const a = hotAt(id), d = Math.hypot(a[0]-pos.x, a[1]-pos.z); if (d < best) { best = d; nearId = id; } }
  const msg = !!laptopCard(), hide = busy() || staging || !!placing || arranging;
  for (const [id, e] of Object.entries(tagEls)) {
    const on = place(e, ...anchorOf(id)) && !hide; e.hidden = !on;
    const near = id === nearId, quest = id === 'laptop' && msg, task = id === 'bed' && !msg && !!S && !stagedTonight();
    const state = [near, quest, task].join('|');
    if (e.dataset.state !== state) { e.dataset.state = state; e.classList.toggle('near', near); e.classList.toggle('quest', quest); e.classList.toggle('task', task);
      e.innerHTML = (quest ? ICON.alert : HOT[id].act) + (near && !quest ? '<kbd> · E / chạm</kbd>' : ''); }
    if (!near && !quest && !task) e.hidden = true;
  }
  updateCoach();
  renderer.render(scene, cam);
  requestAnimationFrame(tick);
}
// Day-1 tutorial, last step: the first evening at home (mo-dau.json tutorial.steps.home); done for this browser once read
const coach = Op.makeCoach();
function updateCoach(){
  const h = OPENING.tutorial.steps.home, want = Op.tutorialOn(S) && S.part === 'evening' && !busy() && !staging && sheet.hidden && !laptopCard();
  if (!want) { if (coach.shown) coach.hide(); return; }
  coach.show({key:'home', who:h.who, text:G.fillName(h.line, S), buttons:[{label:OPENING.tutorial.ok, onClick:() => { Op.setGuide({done:true}); coach.hide(); }}]});
}
requestAnimationFrame(tick);
if (new URLSearchParams(location.search).has('test')) window.__room = {openSheet, openCatalog, startPlace, confirmPlace, rotateGhost, moveGhost, save:() => S, G};   // screenshot scripts only
window.__ready = true;
</script>
