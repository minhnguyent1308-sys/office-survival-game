<meta charset="utf-8">
<title>Tầng Intern</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600&display=swap">

<style>
/* Layout: full-screen 3D floor, small HUD chips pinned to corners, dialog card slides up from bottom.
   Single deliberate look (warm office daylight), same in both host themes. */
:root{
  --ground:#f9f0e1;      /* page + scene background */
  --ink:#2a2230;         /* text, outlines */
  --paper:#fffdf8;       /* HUD cards */
  --muted:#7a6f74;       /* secondary text */
  --accent:#e8505b;      /* lanyard red: active / call to action */
  --lock:#b9b0a6;        /* locked floors */
  --yellow:#f7d046;      /* gossip mode, today's scenario marker */
  --xp:#3c83ec; --pin:#44ba6a; --ut:#e3b23c; --qh:#f45561; /* the four stat bars */
  --up:#dff3e4; --down:#fde2e3; --rule:#eadfcd;
  --font-display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --font-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
.hud{position:fixed;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
.hud.tl{top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));flex-direction:column}
.hud.tr{top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.where{padding:8px 12px;display:grid;gap:2px}
.where b{font-family:var(--font-display);font-weight:800;font-size:20px;line-height:1.1}
.where span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg{display:flex;padding:3px;gap:3px}
.seg button{font:600 13px var(--font-body);border:0;background:transparent;color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);background:var(--paper);border:1px solid var(--lock);border-radius:999px;padding:6px 14px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;z-index:4}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(76px + env(safe-area-inset-top,0px));font:600 13px var(--font-body);background:var(--accent);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 14px;z-index:6;white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
#tags{position:fixed;inset:0;pointer-events:none;z-index:3}
.chip{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;font:600 12px var(--font-body);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:3px 10px;white-space:nowrap;cursor:pointer;opacity:.85;transition:transform .15s,opacity .15s}
.chip::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:inherit;border:inherit;border-top:0;border-left:0;transform:translateX(-50%) rotate(45deg)}
.chip.gossip{background:transparent;border:0;padding:0;opacity:1;box-shadow:none;transform:translate(-22%,-94%);transform-origin:22% 94%} /* tail tip sits on the character */
.chip.gossip::after{display:none}
.chip.gossip.near{background:transparent;transform:translate(-22%,-94%) scale(1.12)}
.chip .bubble{width:46px;height:44px;display:block}
.chip.near{opacity:1;background:var(--accent);color:#fff;border-color:var(--ink);transform:translate(-50%,-112%) scale(1.08)}
.chip.intro{opacity:1;animation:chip-bounce .9s ease-in-out infinite} /* first 10 s: point the player to their desk */
@keyframes chip-bounce{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,-140%)}}
.chip kbd{font:inherit;opacity:.85;margin-left:4px}
.sheet{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(460px,calc(100% - 32px));padding:16px 18px 14px;z-index:6;display:grid;gap:8px}
.sheet .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.sheet p{margin:0;font-size:15px;line-height:1.5}
.sheet .row{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.btn{font:600 14px var(--font-body);background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:8px 16px;cursor:pointer}
.floors{display:grid;gap:6px;margin:4px 0}
.floor{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;padding:6px 10px;border:2px solid var(--lock);border-radius:10px;color:var(--muted);font-size:14px}
.floor .n{font:800 20px var(--font-display);text-align:center}
.floor small{font-size:11px}
.floor.here{border-color:var(--ink);color:var(--ink);background:#fde6e7}
.floor.go{border-color:var(--ink);color:var(--ink);background:var(--paper)} /* a floor you can ride to now (the milk tea shop) */
.sheet h2,.modal h2{margin:0;font:800 24px/1.1 var(--font-display);text-wrap:balance}
.modal .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.modal p{margin:0;font-size:15px;line-height:1.5}
/* game HUD: day, goal, four stats */
.where .goal{font-size:12px;font-weight:600;color:var(--accent);max-width:250px;line-height:1.35}
.where .kpi{font-size:12px;color:var(--ink);max-width:250px;line-height:1.35} /* weekly KPI from anh Tuấn (nhip-choi.json) */
.where .kpi.done{color:var(--pin);font-weight:600}
.where .event{font-size:12px;font-weight:600;color:var(--ink);max-width:250px;line-height:1.35} /* live event (su-kien.json): name, end date, shards */
body.look-gieng_than{--accent:#b3322b} /* Giếng thần day: crimson accent, same tokens */
body.look-gieng_than .where .today{background:#e9dcf7}
.where .today{font-size:12px;font-weight:600;color:var(--ink);background:var(--yellow);border-radius:6px;padding:1px 6px;justify-self:start;max-width:250px} /* special day */
.stats{padding:8px 12px;display:grid;grid-template-columns:auto 92px 30px;gap:5px 8px;align-items:center;font-size:12px}
.stats .bar{height:8px;border-radius:99px;background:var(--rule);border:1.5px solid var(--ink);overflow:hidden;position:relative}
.stats .bar i{display:block;height:100%;background:var(--c)}
.stats .bar s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)} /* XP: Junior mark at 100 */
.stats .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.stats .warn{color:var(--accent);animation:flash 1s steps(2) infinite}
@keyframes flash{50%{opacity:.35}}
.tool{font:600 13px var(--font-body);padding:0 12px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center}
.hud.tr > *,.hud.br > *{height:40px;box-sizing:border-box}
.hud.br{bottom:calc(14px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px))}
.tool.primary{background:var(--ink);color:var(--paper);animation:chip-pulse 1.4s ease-in-out infinite}
@keyframes chip-pulse{50%{transform:translateY(-3px)}} /* gender switch and tool buttons share one height */
.hud.tr .seg button{padding-block:0}
.tool.flash{animation:flash 1s steps(2) infinite}
/* choices and results */
.choices{display:grid;gap:8px;margin-top:6px}
.choice{text-align:left;font:500 14px/1.4 var(--font-body);background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.choice:hover:not(:disabled){background:#fff4d6}
.choice b{color:var(--accent);margin-right:6px}
.choice small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.choice:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.quote{color:var(--muted);font-size:13px}
.comment{font-style:italic}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.delta{font:600 12px var(--font-body);border-radius:999px;padding:2px 8px;border:1.5px solid var(--ink);background:var(--up)}
.delta.down{background:var(--down)}
.note{font-size:13px;color:var(--muted);margin-top:6px}
/* centred modal for 17:55, weekend, mini-game, handbook, closeness, end */
.modal-wrap{position:fixed;inset:0;background:rgba(42,34,48,.35);display:grid;place-items:center;z-index:8;padding:16px}
.modal{width:min(440px,100%);padding:18px;display:grid;gap:10px;max-height:calc(100vh - 32px);overflow:auto}
.modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;flex-wrap:wrap}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.mission{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;padding:7px 0;border-bottom:1px solid var(--rule);font-size:14px}
.mission .tick{width:18px;height:18px;border:2px solid var(--ink);border-radius:5px;display:grid;place-items:center;font-size:12px;font-weight:800}
.mission.done .tick{background:var(--pin);color:#fff}
.mission.done span{color:var(--muted);text-decoration:line-through}
.mission small{color:var(--muted);font-size:12px;white-space:nowrap}
.friend{display:grid;grid-template-columns:76px 1fr 30px;gap:8px;align-items:center;font-size:14px;padding:4px 0}
.friend .bar{height:10px;border-radius:99px;background:var(--rule);border:1.5px solid var(--ink);overflow:hidden;position:relative}
.friend .bar i{display:block;height:100%;background:var(--qh)}
.friend .bar s{position:absolute;left:40%;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.modal .perk{font-size:12.5px;color:var(--muted);margin:0 0 3px 84px;line-height:1.35}
.modal .perk b{font-weight:600}
.modal .perk.on{color:var(--ink)}
.friend .val{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.chip.quest{background:transparent;border:0;padding:0;opacity:1;transform:translate(-22%,-94%);transform-origin:22% 94%;animation:quest-bob 1.1s ease-in-out infinite} /* same bubble as gossip, tail on the head */
.chip.quest::after{display:none}
.chip.quest.near{background:transparent;animation:none;transform:translate(-22%,-94%) scale(1.12)}
@keyframes quest-bob{0%,100%{transform:translate(-22%,-94%)}50%{transform:translate(-22%,-114%)}}
.chip.task{opacity:1;border-color:var(--accent);color:var(--accent)}
.chip.task.near{color:#fff}
/* scene change between the office and the rented room: one full-screen card (same as phong-tro.html) */
.fade{position:fixed;inset:0;z-index:10;background:var(--ink);color:var(--paper);display:grid;place-items:center;align-content:center;gap:6px;text-align:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .5s ease}
.fade.on{opacity:1;pointer-events:auto}
.fade small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow);font-weight:600}
.fade b{font:800 40px/1.05 var(--font-display)}
.fade span{font-size:15px;opacity:.8;max-width:360px}
/* opening (mo-dau.js): full-page screens over the floor, the game HUD waits */
body.opening .hud,body.opening #tags,body.opening .hint,body.opening .toast{display:none!important}
.stats[data-focus] > span{opacity:.35}
.stats[data-focus] > span.on{opacity:1}
@media (prefers-reduced-motion:reduce){.chip{transition:none}.chip.intro,.chip.quest,.stats .warn,.tool.flash,.tool.primary{animation:none}.fade{transition:none}}
@media (max-width:640px){.hud.tl{top:calc(62px + env(safe-area-inset-top,0px))}} /* phone: day card sits under the top-right buttons */
/* HUD layout: day card + stats stacked top-left, buttons top-right, Tan làm bottom-right; the hint, sheet and toast keep clear of all of them */
.hint{max-width:calc(100% - 300px)}
@media (max-width:760px){.hint{max-width:calc(100% - 32px);bottom:calc(64px + env(safe-area-inset-bottom,0px))}.sheet{bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
@media (max-width:900px){.toast{top:calc(272px + env(safe-area-inset-top,0px));white-space:normal;text-align:center;width:max-content;max-width:calc(100% - 32px);box-sizing:border-box}} /* toast drops below the day card + stats column */
</style>

<div class="fade" id="fade" aria-live="polite"><small id="fade-eyebrow"></small><b id="fade-title"></b><span id="fade-sub"></span></div>
<script>/* first frame: paint the scene-change card the previous page handed over, before the 3D world loads */try{const f=JSON.parse(sessionStorage.getItem('ssns-fade')),d=document.getElementById('fade');sessionStorage.removeItem('ssns-fade');if(f&&(d.classList.contains('on')||/from=(home|trasua)/.test(location.hash))){d.style.transition='none';d.classList.add('on');for(const k of['eyebrow','title','sub'])document.getElementById('fade-'+k).textContent=f[k]||''}}catch(e){}</script>

<script type="module">
import * as T from 'three';
import * as G from './engine.js'; // rules of the 40-day loop (no 3D inside)
import * as Wd from './world.js';
import * as Op from './mo-dau.js';      // opening screens, Day-1 tutorial, first-time tips (text: mo-dau.json)
import * as Card from './the-ket-cuc.js'; // the shareable end card (canvas picture)
import * as Ho from './ho-so.js';      // player profile across runs: collection, gifts, share card, counters
import * as Pl from './placements.js'; // partner slots (affiliate): declared, empty for now
import {runMinigame, validateMinigames} from './minigames.js'; // mini-game screens; content in minigames.json  // palette, builders, characters, walk grid shared with the rented room

const P = Wd.P; // one palette for every map
const W = 28, D = 18; // floor size in tiles (x, z)
const ROOMS = [
  {id:'boss',   name:'Phòng sếp',    x0:0,  z0:0, x1:7,  z1:6,  tiles:[P.carpet, '#a64842']},
  {id:'lobby',  name:'Sảnh',         x0:9,  z0:0, x1:18, z1:6,  tiles:[P.floorA, P.floorB]},
  {id:'intern', name:'Phòng Intern', x0:0,  z0:8, x1:12, z1:D,  tiles:[P.floorA, P.floorB]},
  {id:'canteen',name:'Căng tin',     x0:14, z0:8, x1:W,  z1:D,  tiles:[P.floorA, P.floorB]},
  {id:'meeting',name:'Phòng họp',    x0:18, z0:0, x1:W,  z1:6,  tiles:[P.floorA, P.floorB]},
];
const roomAt = (x, z) => ROOMS.find(r => x >= r.x0 && x < r.x1 && z >= r.z0 && z < r.z1);
// wait briefly for the display font so wall signs render in it
await Promise.race([document.fonts?.load('800 60px "Baloo 2"').catch(()=>{}), new Promise(r => setTimeout(r, 1500))]);

/* ---------- Renderer, scene, camera ---------- */
const stage = document.getElementById('stage');
const renderer = new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.outputColorSpace = T.SRGBColorSpace;
stage.appendChild(renderer.domElement);
const scene = new T.Scene(); scene.background = new T.Color(getComputedStyle(document.documentElement).getPropertyValue('--ground').trim()); // one source: the CSS token
const cam = new T.OrthographicCamera(-1,1,1,-1,0.1,200);
const camOffset = new T.Vector3(20, 19, 20);
const CENTER = new T.Vector3(W/2, 0, 8.5);
const camTarget = CENTER.clone();
const hemi = new T.HemisphereLight('#ffffff', '#c9b89b', 1.6); scene.add(hemi);
const sun = new T.DirectionalLight('#fff5e3', 2.15);
sun.position.set(W/2 + 8, 18, D/2 - 6); sun.target.position.set(W/2, 0, D/2); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0006;
Object.assign(sun.shadow.camera, {left:-21, right:21, top:21, bottom:-21, near:1, far:80}); scene.add(sun);

/* ---------- Builders: one helper for every prop, shared with every map (world.js) ---------- */
const {mat, box, textTex, faceMats, sign, plant, makeChar, tagHot, blockers, hotMeshes} = Wd.makeKit(scene);

/* ---------- Floor: one texture, each room its own tiles ---------- */
{
  const c = document.createElement('canvas'); c.width = W; c.height = D; const x = c.getContext('2d');
  for (let i=0;i<W;i++) for (let j=0;j<D;j++){ const r = roomAt(i+.5, j+.5); const t = r ? r.tiles : [P.hallA, P.hallB]; x.fillStyle = t[(i+j)%2]; x.fillRect(i,j,1,1); }
  const t = new T.CanvasTexture(c); t.magFilter = T.NearestFilter; t.colorSpace = T.SRGBColorSpace;
  // the slab is cut into pieces along the rooms that open later, so a closed room disappears whole (floor included)
  // closed rooms keep their floor, in grey: same checker, no colour (the room is there, just not yet yours)
  const g = document.createElement('canvas'); g.width = W; g.height = D; const gx = g.getContext('2d');
  for (let i=0;i<W;i++) for (let j=0;j<D;j++){ gx.fillStyle = ['#d6d6d3', '#cbcbc8'][(i+j)%2]; gx.fillRect(i,j,1,1); }
  const gt = new T.CanvasTexture(g); gt.magFilter = T.NearestFilter; gt.colorSpace = T.SRGBColorSpace;
  const part = (tex, x0, z0, x1, z1) => { const c = tex.clone(); c.repeat.set((x1-x0)/W, (z1-z0)/D); c.offset.set(x0/W, 1 - z1/D); c.needsUpdate = true; return new T.MeshStandardMaterial({map:c, roughness:.9}); };
  const slab = (x0, z0, x1, z1) => { const top = part(t, x0, z0, x1, z1);
    const m = box(x0, z0, -.2, x1-x0, z1-z0, .2, P.floorB, {round:0, cast:false, shell:true, faces:[mat('#d8c39e'),mat(P.floorB),top,mat(P.floorB),mat('#e2cfab'),mat(P.floorB)]});
    m.userData.floor = {open:top, closed:part(gt, x0, z0, x1, z1)}; };
  slab(0, 0, 14, D); slab(14, 0, 18, 8); slab(18, 6, W, 8); // always open
  slab(14, 8, W, D); slab(18, 0, W, 6);                     // canteen, meeting room
}
/* ---------- Outer walls (cutaway: only the two far walls) ---------- */
box(-.25, -.25, 0, .25, D + .25, 3, P.wallL, {round:0, block:true});
box(0, -.25, 0, 18, .25, 3, P.wallB, {round:0, block:true}); box(18, -.25, 0, W-18, .25, 3, P.wallB, {round:0, block:true, shell:true}); // split at the meeting room
box(-.25, -.25, 3, .25, D + .25, .08, P.trim, {round:0});
box(0, -.25, 3, 18, .25, .08, P.trim, {round:0}); box(18, -.25, 3, W-18, .25, .08, P.trim, {round:0, shell:true});
box(0, 0, 0, .04, D, .14, P.woodDark, {round:0, cast:false});
box(0, 0, 0, 18, .04, .14, P.woodDark, {round:0, cast:false}); box(18, 0, 0, W-18, .04, .14, P.woodDark, {round:0, cast:false, shell:true});
/* ---------- Room dividers: low walls keep every room visible from above ---------- */
const halfWall = (x0, z0, x1, z1) => { box(x0, z0, 0, x1-x0, z1-z0, 1.05, P.half, {round:0, block:true, shell:true}); box(x0-.02, z0-.02, 1.05, x1-x0+.04, z1-z0+.04, .06, P.trim, {round:0, shell:true}); };
const glass = new T.MeshStandardMaterial({color:P.glass, transparent:true, opacity:.28, roughness:.1, depthWrite:false});

function roundTable(cx, cz){
  const t = new T.Mesh(new T.CylinderGeometry(.7,.7,.06,28), mat(P.wood)); t.position.set(cx,.76,cz); t.castShadow = t.receiveShadow = true; scene.add(t);
  const l = new T.Mesh(new T.CylinderGeometry(.08,.12,.74,12), mat(P.dark)); l.position.set(cx,.37,cz); l.castShadow = true; scene.add(l);
  const f = new T.Mesh(new T.CylinderGeometry(.35,.35,.04,20), mat(P.dark)); f.position.set(cx,.02,cz); scene.add(f);
  box(cx - .15, cz - .15, .79, .3, .3, .1, P.paper, {round:.05});
  blockers.push({x0:cx-.7, z0:cz-.7, x1:cx+.7, z1:cz+.7});
  [Math.PI/2, Math.PI*7/6, Math.PI*11/6].forEach(a => {
    const sx = cx + Math.cos(a)*1.05, sz = cz + Math.sin(a)*1.05;
    const st = new T.Mesh(new T.CylinderGeometry(.24,.24,.06,18), mat(P.red)); st.position.set(sx,.45,sz); st.castShadow = true; scene.add(st);
    const sl = new T.Mesh(new T.CylinderGeometry(.05,.07,.42,10), mat(P.metalDark)); sl.position.set(sx,.21,sz); sl.castShadow = true; scene.add(sl);
    blockers.push({x0:sx-.24, z0:sz-.24, x1:sx+.24, z1:sz+.24});
    SEATS.push([sx, sz, Math.atan2(cx - sx, cz - sz), cx + Math.cos(a)*1.75, cz + Math.sin(a)*1.75]); // seat x,z, facing, approach x,z
  });
}

const ELEV = [11.3, .7];

let doorOpen = 0, doorTarget = 0;
const rand = (a, b) => a + Math.random()*(b - a);
function updateClient(dt){
  const s = clientState; let moving = false;
  if (client.g.visible && engaged('client')) faceP(client);
  else if (s.phase === 'questTo') { moving = stepChar(client, dt, 2.2); if (doorOpen > .9 && client.g.position.z > 1.8) doorTarget = 0; if (!moving) s.phase = 'questWait'; }
  else if (s.phase === 'questWait') faceP(client);
  else if (s.phase === 'away') { if (cutscene) return; s.timer -= dt; if (s.timer <= 0) { s.phase = 'arrive'; s.timer = .7; doorTarget = 1; } }
  else if (s.phase === 'arrive') { s.timer -= dt; if (s.timer <= 0) {
      client.g.position.set(ELEV[0], 0, ELEV[1]); client.g.rotation.y = 0; client.g.visible = true;
      planPath(client, 14.9, 4.3); s.phase = 'toDesk'; toast('Có khách hàng vừa tới sảnh'); } }
  else if (s.phase === 'toDesk') { moving = stepChar(client, dt, 2.2); if (doorOpen > .9 && client.g.position.z > 1.8) doorTarget = 0;
      if (!moving) { s.phase = 'sign'; s.wait = 3; client.g.rotation.y = Math.PI; } }
  else if (s.phase === 'sign') { s.wait -= dt; if (s.wait <= 0) { planPath(client, 10.35, 5.0); s.phase = 'toSofa'; } }
  else if (s.phase === 'toSofa') { moving = stepChar(client, dt, 2.2); if (!moving) { s.phase = 'waiting'; s.wait = rand(12, 20); client.g.rotation.y = Math.PI/2; } }
  else if (s.phase === 'waiting') { s.wait -= dt; if (s.wait <= 0) { planPath(client, ELEV[0], ELEV[1] + .3); s.phase = 'leave'; } }
  else if (s.phase === 'leave') { moving = stepChar(client, dt, 2.4);
      if (client.g.position.distanceTo(new T.Vector3(ELEV[0], 0, ELEV[1] + .3)) < 1.6) doorTarget = 1;
      if (!moving) { client.g.visible = false; met.delete('client'); doorTarget = 0; s.phase = 'away'; s.timer = rand(20, 45); if (nearId === 'client') closeSheet(); } }
  animateWalk(client, moving, dt);
  doorOpen += (doorTarget - doorOpen) * Math.min(1, dt*4);
  doorL.position.x = doorX[0] - doorOpen*.95; doorR.position.x = doorX[1] + doorOpen*.95;
}

// the elevator mirror on "Ảnh thẻ hồ sơ": its own small view with only you in it (no floor behind), drag to turn,
// then you ease back to face the mirror. shoot(): head and shoulders on the photo backdrop, for the form.
function makeMirror(host){
  const r = new T.WebGLRenderer({antialias:true, alpha:true});
  r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.outputColorSpace = T.SRGBColorSpace;
  const sc = new T.Scene(), kit = Wd.makeKit(sc), cm = new T.PerspectiveCamera(26, 1, .1, 50);
  sc.add(new T.HemisphereLight('#ffffff', '#c9b89b', 1.6));
  const key = new T.DirectionalLight('#fff5e3', 1.8); key.position.set(3, 6, 8); sc.add(key);
  const fit = () => { const w = host.clientWidth || 1, h = host.clientHeight || 1; r.setSize(w, h, false); cm.aspect = w / h; cm.updateProjectionMatrix(); };
  const frame = () => { const k = Wd.BODY_SCALE; cm.position.set(0, 1.2 * k, 6.6 * k); cm.lookAt(0, .95 * k, 0); };   // voxel body: whole person in view, the big head clear of the arch, feet not cut on phones
  host.prepend(r.domElement); frame(); fit();
  const ro = new ResizeObserver(fit); ro.observe(host);
  let me = null, dragX = null, hold = 0, raf = 0, t0 = performance.now();
  const wrapPi = a => ((a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  const loop = now => {
    const dt = Math.min(.05, (now - t0) / 1000); t0 = now;
    if (me && dragX == null && (hold -= dt) <= 0) { const want = reduce ? 0 : Math.sin(now / 1400) * .35, ry = me.g.rotation;
      ry.y = want + wrapPi(ry.y - want); ry.y += (want - ry.y) * Math.min(1, dt * 3); }   // the shortest way back to the front
    r.render(sc, cm); raf = requestAnimationFrame(loop);
  };
  const cv = r.domElement;
  cv.addEventListener('pointerdown', e => { dragX = e.clientX; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => { if (dragX == null || !me) return; me.g.rotation.y += (e.clientX - dragX) * .012; dragX = e.clientX; hold = 1.5; });
  const up = () => { dragX = null; }; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  raf = requestAnimationFrame(loop);
  return {
    wear(look){ const ry = me ? me.g.rotation.y : 0; if (me) sc.remove(me.g); me = kit.makeChar(Wd.playerLook(look)); me.g.rotation.y = ry; },
    shoot(){
      if (!me) return null;
      try {
        me.g.rotation.y = 0; sc.background = new T.Color('#fff2c4');
        r.setPixelRatio(1); r.setSize(320, 400, false); cm.aspect = .8; cm.updateProjectionMatrix();
        const k = Wd.BODY_SCALE; cm.position.set(0, 1.3 * k, 4.1 * k); cm.lookAt(0, 1.15 * k, 0); r.render(sc, cm);   // head and shoulders
        return cv.toDataURL('image/jpeg', .85);
      } catch { return null; }
    },
    close(){ cancelAnimationFrame(raf); ro.disconnect(); r.dispose(); r.forceContextLoss(); cv.remove(); },
  };
}

const coach = Op.makeCoach(), TUT = OPENING.tutorial;

const hideCoach = () => { coach.hide(); ring([]); };
function ring(els, stat = null){
  for (const e of tut.ringed) e.classList.remove('coach-ring'); tut.ringed = els; for (const e of els) e.classList.add('coach-ring');
  if ((statsEl.dataset.focus || null) !== stat) { if (stat) statsEl.dataset.focus = stat; else delete statsEl.dataset.focus; renderHUD(); }
}
const say = line => G.fillName(line, S);
const offBtn = {label:TUT.off, ghost:true, onClick:() => { Op.setGuide({off:true}); hideCoach(); }};
function tutorialStep(){
  const st = TUT.steps, d = tut.done;
  if (S.today.cardId === 'D1' && !S.today.cardDone)
    return nearId === 'letan' ? {key:'talk', text:say(st.talk), buttons:[offBtn]} : {key:'walk', text:say(st.walk), ring:[goalEl], buttons:[offBtn]};
  if (G.hasFlag(S, 'co_so_tay') && !d.has('stats')) { const s = st.stats[tut.stat], last = tut.stat === st.stats.length - 1;
    return {key:'stats' + tut.stat, text:say(s.line), ring:[statsEl], stat:s.stat, buttons:[{label:TUT.next, onClick:() => { if (last) d.add('stats'); else tut.stat++; }}]}; }
  if (G.hasFlag(S, 'co_so_tay') && !d.has('handbook')) return {key:'handbook', text:say(st.handbook), ring:[hbBtn]};
  if (nearId && PEOPLE.has(nearId) && nearId !== 'letan' && !met.has(nearId) && !d.has('meet')) return {key:'meet', text:say(st.meet)};
  if (S.part === 'afternoon' && !S.today.action) return {key:'afternoon', text:say(st.afternoon)};
  if (S.part === 'evening') return {key:'evening', text:say(st.evening), ring:[leaveBtn]};

const TIPS = [
  ['canteen', () => G.roomOpen(S, 'canteen') && S.day > 1],
  ['trasua', () => S.rooms?.includes('trasua')],
  ['kpi', () => S.week?.kpi && S.week.kpiSeen],
  ['special', () => !!S.today.specialId && S.today.specialDone],
  ['lowPin', () => S.stats.pin < 20],
  ['close', () => G.NPC_IDS.some(n => S.close[n] >= G.CLOSE_UNLOCK)],
];
function tipStep(){
  if (Op.guide().off) return null;
  const seen = Op.guide().tips || [], hit = TIPS.find(([id, when]) => !seen.includes(id) && when());
  if (!hit) return null;
  const id = hit[0], t = OPENING.tips[id], n = id === 'close' ? G.NPC_IDS.find(x => S.close[x] >= G.CLOSE_UNLOCK) : null;
  const who = n ? G.NPC_NAME[n] : t.who, text = n ? t.line.replace('{toi}', G.NPC_NAME[n].split(' ')[0].toLowerCase()) : t.line;
  return {key:'tip:' + id, who, text:say(text), buttons:[{label:TUT.ok, onClick:() => { Op.tipOnce(id); hideCoach(); }}]};
}
function updateCoach(){
  const busy = opening || cutscene || staging || mgRunning || !sheet.hidden || !modalWrap.hidden || !collEl.hidden || fadeEl.classList.contains('on');
  if (busy) { if (coach.shown) hideCoach(); return; }
  if (S.day > 1 && Op.guide().started && !Op.guide().done) Op.setGuide({done:true});   // the first day is behind you
  const on = Op.tutorialOn(S), step = on ? tutorialStep() : tipStep();
  if (!step) { if (coach.shown) hideCoach(); return; }
  if (on && !Op.guide().started) Op.setGuide({started:true});
  if (coach.key !== step.key) { coach.show({key:step.key, who:step.who || TUT.who, text:step.text, buttons:step.buttons}); ring(step.ring || [], step.stat || null); }
}

};
document.getElementById('open-friends').onclick = () => {

};
const collEl = document.getElementById('collection');   // Bộ sưu tập: the so.css book, drawn by ho-so.js
document.getElementById('open-collection').onclick = () => { closeSheet(); Ho.openCollection(collEl, PROFILE.p, REVIEW, CARDS, S.runId, PROFILE, () => ({day: S.day, trang: location.pathname})); };
modalWrap.addEventListener('keydown', e => { if (e.key === 'Escape' && modalEl.querySelector('.row .btn:last-child')?.textContent === 'Đóng') closeModal(); });

// talking: today's card first; every talk counts for "Chào hỏi cả công ty"
function gameTalk(id){
  if (PEOPLE.has(id) && id !== 'letan') tut.done.add('meet');
  if (PEOPLE.has(id) || id === 'chef') { G.recordTalk(S, storyId(id)); afterChange(); }
  if (id === questId && S.part === 'morning' && !S.today.cardDone) { openCard(id); return true; }

}
wearLook(G.lookOf(S));
for (const id of ['lock_canteen', 'lock_canteen2', 'lock_meeting']) HOT[id].text = CARD_DATA.rooms?.lockedSigns?.[HOT[id].lock] || 'Phòng này chưa mở.';
applyRooms(); dressForToday();
// resume exactly where the save left off
// live event with firstOpen (su-kien.json, Lily 19/11): each player meets its special day once, on this morning if the story has not
// started yet, otherwise on the next ordinary working morning. The profile remembers it once played; a draft (?thu=) never counts.
function eventDayCheck(){
  if (standIn || DRAFT) return;
  for (const e of G.liveEvents()) {
    if (!e.firstOpen || PROFILE.eventDone(e.id)) continue;
    const r = G.queueEventDay(S, CARDS, e.firstOpen);
    if (r === 'done') PROFILE.markEvent(e.id, S.runId);
    if (r === 'later' && S.part !== 'over' && S.day > 1 && !S.today.eventSoonTold) { S.today.eventSoonTold = true; notify(e.soon); }
    save();
  }
}
function resumeRun(){
  eventDayCheck();
  if (G.isAtHome(S)) goHome();                  // evening after 17:55 or the weekend: that happens in the rented room
  else if (S.part === 'evening' && !fromShop) showEvening(); // back from the shop after the afternoon: "Tan làm" waits on its button
  else if (S.part === 'over') showFinale();
  else setupMorning();
}
if (fromHome || fromShop || DRAFT) resumeRun(); else welcomeScreen();
afterChange();
if (S.today.wake?.pin && !S.today.wakeShown) { S.today.wakeShown = true; notify(`Ngủ dậy: Pin +${S.today.wake.pin}`); save(); } // the room sent us here the morning after
// arriving from the rented room: the room's "Sáng hôm sau" card (already on screen) fades out on the office
if (fromHome && !G.isAtHome(S)) {
  Wd.paintFade(Wd.morningCard(G.weekdayName(S.day), S.day));
  fadeEl.style.transition = 'none'; fadeEl.classList.add('on'); fadeEl.offsetWidth; fadeEl.style.transition = '';
  setTimeout(() => fadeEl.classList.remove('on'), 700);
} else if (fromShop) {                         // back from the milk tea shop: out of the elevator, the shop's card fades out
  fadeEl.style.transition = 'none'; fadeEl.classList.add('on'); fadeEl.offsetWidth; fadeEl.style.transition = '';
  setTimeout(() => fadeEl.classList.remove('on'), 700);
} else fadeEl.classList.remove('on');

/* ---------- Loop ---------- */
let followK = 1;
function resize(){
  const w = innerWidth, h = innerHeight, a = w/h; renderer.setSize(w, h, false);
  const f = a >= 1 ? Math.max(18 / a, 10.8) : 7.5 / a; followK = a >= 1 ? .25 : 1;
  Object.assign(cam, {left:-f*a, right:f*a, top:f, bottom:-f}); cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
let nearId = null, t0 = performance.now(), lastRoom = null, elapsed = 0, evIdle = 0;
const INTRO_S = 10; // the desk label shows (bouncing) for the first 10 s, then behaves like every other spot
const v3 = new T.Vector3();
const place = (el, x, y, z) => { v3.set(x, y, z).project(cam);
  el.style.left = ((v3.x+1)/2*innerWidth) + 'px'; el.style.top = ((1-v3.y)/2*innerHeight) + 'px';
  return Math.abs(v3.x) <= 1 && v3.y <= .97 && v3.y >= -1; };
function tick(now){
  const dt = Math.min(.05, (now - t0)/1000); t0 = now; elapsed += dt; const speed = 3.4; let moving = false;
  const pos = player.g.position;
  let kx = 0, kz = 0;
  if (cutscene) keys.clear();
  if (keys.has('w')||keys.has('arrowup')) { kx -= 1; kz -= 1; }
  if (keys.has('s')||keys.has('arrowdown')) { kx += 1; kz += 1; }
  if (keys.has('a')||keys.has('arrowleft')) { kx -= 1; kz += 1; }
  if (keys.has('d')||keys.has('arrowright')) { kx += 1; kz -= 1; }
  if (kx || kz) {
    const l = Math.hypot(kx, kz), dx = kx/l*speed*dt, dz = kz/l*speed*dt;
    if (free(pos.x + dx, pos.z)) pos.x += dx; if (free(pos.x, pos.z + dz)) pos.z += dz;
    player.g.rotation.y = Math.atan2(kx, kz); moving = true; closeSheet();
  } else if (player.path.length) {
    moving = stepChar(player, dt, speed);
    if (!player.path.length && pendingHot) { const id = pendingHot; pendingHot = null; if (hotActive(id)) openSheet(id); }
  }
  animateWalk(player, moving, dt);
  if (sceneSit != null) sitPose(player, true, sceneSit);
  if (fainted) player.g.position.y = player.lie;                                        // lying on the floor, not through it
  updateClient(dt);
  updateSeniors(dt);
  updateQuests(dt);
  for (const [id, n] of Object.entries(NPCS)) if (!n.wander && !n.quest) { if (engaged(id)) faceP(n.c); else n.c.g.rotation.y = n.rot; }
  const br = reduce ? 0 : Math.sin(now/600)*.015;
  Object.values(NPCS).forEach((n, i) => n.c.parts.head.position.y = n.c.headY + (i%2 ? br : -br));
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.hidden = true; }
  else if (toastQueue.length) toast(toastQueue.shift());
  // staged midday event (cards.json when "midday"): once the morning is over and nothing is on screen, it starts by itself
  const ev = !staging && !cutscene && !mgRunning && sheet.hidden && modalWrap.hidden && collEl.hidden && !fadeEl.classList.contains('on') ? G.todaysEvent(S, CARDS) : null;
  if (ev) { evIdle += dt; if (evIdle > 1.2) { evIdle = 0; runStage(ev); } } else evIdle = 0;
  updateSlots();
  updateCoach();
  if (meBubble > 0) { meBubble -= dt; meBubbleEl.hidden = !place(meBubbleEl, pos.x, Wd.TAG_Y + pos.y, pos.z); } else meBubbleEl.hidden = true;
  // HUD room name
  const room = roomAt(pos.x, pos.z), rn = room ? room.name : 'Hành lang';
  if (rn !== lastRoom) { lastRoom = rn; document.getElementById('room-name').textContent = 'Tầng 1 · ' + rn; if (room) { G.recordRoom(S, room.id); afterChange(); } }
  // camera follow
  if (camFocus) v3.copy(camFocus); else v3.set(CENTER.x + (pos.x - CENTER.x)*followK, 0, CENTER.z + (pos.z - CENTER.z)*followK);
  camTarget.lerp(v3, reduce ? 1 : Math.min(1, dt*3));
  const zoomTo = camFocus ? focusZoom() : 1;                                   // verdict scene: the meeting room fills the screen
  if (Math.abs(cam.zoom - zoomTo) > .002) { cam.zoom += (zoomTo - cam.zoom) * (reduce ? 1 : Math.min(1, dt*2)); cam.updateProjectionMatrix(); }
  cam.position.copy(camTarget).add(camOffset); cam.lookAt(camTarget);
  // nearest hotspot
  nearId = null; let best = 1.4;
  for (const id of Object.keys(HOT)) { if (!hotActive(id)) continue; const a = hotAt(id), d = Math.hypot(a[0]-pos.x, a[1]-pos.z); if (d < best) { best = d; nearId = id; } }
  for (const [id, el] of Object.entries(tagEls)) {
    const on = place(el, ...anchorOf(id)) && hotActive(id); el.hidden = !on;
    const near = id === nearId;
    const intro = id === 'desk' && elapsed < INTRO_S && !near && S.day === 1;
    const quest = id === questId && S.part === 'morning' && !S.today.cardDone;                    // today's card: bouncing "!"
    const task = !quest && S.part === 'afternoon' && !S.today.action && !!TASK_TAG[id];        // afternoon places light up
    const gos = !quest && isGossip(id) && (near || NPCS[id].wander.sitAge < 3), state = [near, gos, intro, quest, task].join('|'); // bubble shows 3 s after sitting down, then hides (back when you walk up)
    if (el.dataset.state !== state) { el.dataset.state = state; el.classList.toggle('near', near); el.classList.toggle('gossip', gos); el.classList.toggle('intro', intro); el.classList.toggle('quest', quest); el.classList.toggle('task', task);
      const label = quest ? ICON.alert : task ? TASK_TAG[id] : PEOPLE.has(id) ? (gos ? ICON.dots : 'Nói chuyện') : intro ? HOT[id].tag : HOT[id].act || HOT[id].tag;
      el.innerHTML = label + (near && !gos && !quest ? '<kbd> · E / chạm</kbd>' : ''); }
    if ((PEOPLE.has(id) || HOT[id].act) && !near && !gos && !intro && !quest && !task) el.hidden = true; // no floating label; prompt only when close
    if (cutscene) el.hidden = true;                                                     // verdict scene: no prompts over the meeting
  }
  leaveBtn.hidden = !(S.part === 'evening' && sheet.hidden && modalWrap.hidden && collEl.hidden);
  animateLook(performance.now() / 1000);
  if (!opening) renderer.render(scene, cam);                                  // an opening screen covers the floor
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
// Practice: every mini-game on its own, nothing is saved. Opened by the "Mini-game" button, or by a link ?thu=<id>[&flags=a,b] (ids: minigames.json)
const practiceFlags = game => [...new Set((game.questions || []).flatMap(q => q.answers.map(a => a.needFlag)).filter(Boolean))]; // every badge answer is playable
async function practice(game, flags = practiceFlags(game)){
  if (mgRunning) return; mgRunning = true; closeModal(); closeSheet();
  const res = await runMinigame(game, {eyebrow: 'Chơi thử · ' + game.name, hasFlag: f => flags.includes(f), badgeName});
  mgRunning = false;
  const grade = G.gradeOf(game, res.score), gradeName = Object.fromEntries(G.minigameGrades())[grade];
  modal({eyebrow: 'Chơi thử · không lưu vào ván', title: `${game.name}: ${gradeName}`,
    nodes: [el('p', null, res.detail), el('p', 'comment', game.lines?.[grade] || '')],
    actions: [{label: 'Chơi lại', onClick: () => practice(game, flags)}, {label: 'Danh sách', ghost: true, onClick: openMinigameMenu}, {label: 'Đóng', ghost: true, onClick: closeModal}]});
}
const KIND_NAME = {sort: 'Phân loại', schedule: 'Xếp lịch', quiz: 'Hỏi đáp'};
function openMinigameMenu(){

}
document.getElementById('open-minigames').onclick = openMinigameMenu;
{ const q = new URLSearchParams(location.search), g = G.minigameById(q.get('thu') || window.__THU);
  if (g) setTimeout(() => practice(g, q.has('flags') ? q.get('flags').split(',').filter(Boolean) : window.__THUFLAGS ? window.__THUFLAGS.split(',') : undefined), 600); }
